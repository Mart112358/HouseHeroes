name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_WEBAPP_NAME: 'househeroes-api'
  AZURE_CONTAINER_REGISTRY: 'househeroesacr.azurecr.io'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    # Integration tests start a SQL Server container (Testcontainers); the runner has Docker.
    # SchemaTests fails if mobile/schema.graphql no longer matches the API.
    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: success()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  mobile:
    name: Mobile App (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: mobile/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Check generated GraphQL client is up to date
      run: |
        npm run codegen
        git diff --exit-code -- src/graphql/generated

    - name: Typecheck
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm test -- --ci

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Run security audit
      run: dotnet list package --vulnerable --include-transitive
      
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  terraform-plan-staging:
    name: Terraform Plan (Staging)
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0
        
    - name: Azure CLI Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}
        
    - name: Terraform Init
      working-directory: ./infra
      run: terraform init -backend-config="staging.tfbackend"
      
    - name: Terraform Validate
      working-directory: ./infra
      run: terraform validate
      
    - name: Terraform Plan
      working-directory: ./infra
      run: |
        terraform plan \
          -var-file="staging.tfvars" \
          -var="resource_group_name=rg-househeroes-staging" \
          -var="sql_server_admin_password=${{ secrets.SQL_SERVER_ADMIN_PASSWORD_STAGING }}" \
          -no-color
        
  deploy-staging:
    name: Deploy to Azure Staging (Terraform)
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0
        terraform_wrapper: false
        
    - name: Azure CLI Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}
        
    - name: Terraform Init
      working-directory: ./infra
      run: terraform init -backend-config="staging.tfbackend"
      
    - name: Terraform Apply
      working-directory: ./infra
      run: |
        terraform apply \
          -var-file="staging.tfvars" \
          -var="resource_group_name=rg-househeroes-staging" \
          -var="sql_server_admin_password=${{ secrets.SQL_SERVER_ADMIN_PASSWORD_STAGING }}" \
          -auto-approve
        
    - name: Build, push, migrate and deploy (Staging)
      working-directory: ./infra
      run: ./deploy-app.sh staging staging-${{ github.sha }}

  deploy-production:
    name: Deploy to Azure Production (Terraform)
    runs-on: ubuntu-latest
    needs: [build-and-test, mobile, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0
        terraform_wrapper: false
        
    - name: Azure CLI Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PRODUCTION }}
        
    - name: Terraform Init
      working-directory: ./infra
      run: terraform init -backend-config="production.tfbackend"
      
    - name: Terraform Apply
      working-directory: ./infra
      run: |
        terraform apply \
          -var-file="production.tfvars" \
          -var="resource_group_name=rg-househeroes-production" \
          -var="sql_server_admin_password=${{ secrets.SQL_SERVER_ADMIN_PASSWORD_PRODUCTION }}" \
          -auto-approve
        
    - name: Build, push, migrate and deploy (Production)
      working-directory: ./infra
      run: ./deploy-app.sh production prod-${{ github.sha }}
